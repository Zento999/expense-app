[alembic]
script_location = alembic
# ให้ env.py import โมดูล app ได้ (คำสั่ง alembic ไม่ใส่โฟลเดอร์ปัจจุบันใน sys.path ให้เอง)
prepend_sys_path = .
# ค่า sqlalchemy.url ไม่ใส่ที่นี่ — env.py อ่านจาก DATABASE_URL แทน (รหัสผ่านจะได้ไม่อยู่ในไฟล์)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
